[package]
name = "pictowebp"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Blazingly fast bulk image-to-WebP converter"
license = "MIT"
repository = "https://github.com/aditya-xq/PicToWebP"
readme = "../README.md"
keywords = ["webp", "image", "converter", "batch", "optimization"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["fuzz/"]

# `cargo binstall pictowebp` downloads the prebuilt release binary instead of
# compiling from source.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/rust-v{ version }/pictowebp-{ version }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
# Only the codecs we discover (jpg/jpeg/png/webp) - keeps compile times and
# binary size down.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
indicatif = { version = "0.18", features = ["rayon"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
webp = "0.3"
libwebp-sys = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

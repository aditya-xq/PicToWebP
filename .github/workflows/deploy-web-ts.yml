name: Deploy web-ts to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-ts/**'
      - 'agent/**'
      - 'llms.txt'
      - 'docs/agent-contract.md'
      - '.github/workflows/deploy-web-ts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-ts/package-lock.json

      - name: Install dependencies
        working-directory: web-ts
        run: npm ci

      - name: Install Playwright browser
        working-directory: web-ts
        run: npx playwright install --with-deps chromium

      - name: Test
        working-directory: web-ts
        run: npm test

      - name: Build
        working-directory: web-ts
        run: npm run build

      - name: E2E smoke tests
        working-directory: web-ts
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Verify build output
        working-directory: web-ts
        run: |
          test -f dist/index.html
          grep -q 'Content-Security-Policy' dist/index.html

      # `npm run build` publishes and validates the agent surface (see
      # web-ts/build/agent-surfaces.ts). This step is a second, explicit gate so
      # a future build change cannot silently drop the manifests.
      - name: Verify agent surfaces
        working-directory: web-ts
        run: |
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/index.html.md
          test -f dist/.well-known/agent-skills/index.json
          test -f dist/.well-known/ard.json
          test -f dist/agent/pictowebp/SKILL.md
          grep -q 'rel="ard"' dist/index.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web-ts/dist
          # `.well-known/` and `.nojekyll` are hidden files, and this action
          # excludes top-level dot entries by default. Without this flag the
          # discovery manifests are built, verified, and then silently dropped.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      # The build verifies the surface on disk, but the upload step can still
      # drop files (it excluded every dot entry until include-hidden-files was
      # set). Check what is actually served, with retries for CDN lag.
      - name: Verify published agent surface
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          fail=0
          for path in llms.txt llms-full.txt index.html.md \
                      .well-known/ard.json .well-known/agent-skills/index.json; do
            code=000
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' "${PAGE_URL}${path}" || true)
              [ "$code" = "200" ] && break
              sleep 5
            done
            echo "${path} -> ${code}"
            [ "$code" = "200" ] || fail=1
          done
          exit "$fail"

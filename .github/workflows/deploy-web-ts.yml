name: Deploy web-ts to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web-ts/**'
      - '.github/workflows/deploy-web-ts.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-ts/package-lock.json

      - name: Install dependencies
        working-directory: web-ts
        run: npm ci

      - name: Test
        working-directory: web-ts
        run: npm test

      - name: Build
        working-directory: web-ts
        run: npm run build

      - name: Verify build output
        working-directory: web-ts
        run: |
          test -f dist/index.html
          grep -q 'Content-Security-Policy' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web-ts/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

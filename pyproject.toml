[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pictowebp"
version = "1.1.0"
description = "Blazingly fast bulk image-to-WebP converter with a CLI and a web UI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aditya XQ" }]
keywords = ["webp", "image", "converter", "batch", "optimization"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    # 13.0.0 fixes the 40 advisories affecting 12.3.0. It requires Python 3.11+,
    # which is why the package no longer supports the EOL 3.10 runtime.
    "pillow>=13.0",
    "tqdm>=4.70",
]

[project.optional-dependencies]
# The local web UI (FastAPI server). CLI-only installs skip these.
web = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "python-multipart>=0.0.20",
]

[project.scripts]
pictowebp = "pictowebp.cli:main"
pictowebp-web = "pictowebp.web.app:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "httpx2>=2.12",
    "ruff>=0.16",
    "pyright>=1.1.400",
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "python-multipart>=0.0.20",
    "jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src_py/pictowebp"]

# The Python sdist is not the distribution channel for the Rust crate or the
# Vite UI; including their build trees would pull in node_modules and binaries.
[tool.hatch.build.targets.sdist]
exclude = [
    "web-ts",
    "src_rust",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
pythonVersion = "3.11"
include = ["src_py", "tests"]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src_py", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
